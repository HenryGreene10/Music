<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How Modern Music Resurrects the Past</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafaf8;
        --text: #1f1f1b;
        --muted: #444444;
        --accent: #e07a5f;
        --card-shadow: 0 4px 32px rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      body {
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100vh;
      }

      .viz-shell {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .viz-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        opacity: 1;
      }

      .card-shell {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      .card {
        position: fixed;
        position: relative;
        z-index: 1000;
        width: min(520px, calc(100vw - 48px));
        max-height: calc(100vh - 160px);
        padding: 32px 36px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: var(--card-shadow);
        opacity: 1;
        transition: opacity 0.15s ease;
        overflow: hidden;
        overflow-y: auto;
        pointer-events: auto;
      }

      .skip-link {
        position: absolute;
        top: 16px;
        right: 20px;
        padding: 0;
        border: 0;
        background: transparent;
        font: inherit;
        font-size: 11px;
        color: #bbb;
        cursor: pointer;
        transition: color 180ms ease;
      }

      .skip-link:hover {
        color: #777;
      }

      .step-counter {
        position: absolute;
        top: 16px;
        left: 20px;
        font-size: 11px;
        color: #bbb;
      }

      .step-counter.is-hidden {
        display: none;
      }

      .page.is-exploring .card-shell {
        display: none;
      }

      .card h2 {
        margin: 0 0 14px;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 22px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .card p {
        margin: 0;
        font-size: 15px;
        line-height: 1.7;
        color: var(--muted);
      }

      .stat {
        display: inline-flex;
        align-items: center;
        margin-top: 20px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(224, 122, 95, 0.12);
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .card-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 26px;
      }

      .nav-button {
        padding: 0;
        border: 0;
        background: transparent;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity 180ms ease,
          color 180ms ease;
      }

      .nav-button:hover {
        opacity: 0.75;
      }

      .nav-button.is-back {
        color: #767676;
      }

      .nav-button.is-next {
        color: #555;
      }

      .nav-button.is-explore {
        color: var(--accent);
        font-size: 15px;
        font-weight: 700;
      }

      .nav-button.is-hidden {
        visibility: hidden;
        pointer-events: none;
      }

      .explore-button {
        display: none;
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 180ms ease;
      }

      .explore-button:hover {
        opacity: 0.9;
      }

      .explore-button.is-visible {
        display: block;
      }

      @media (max-width: 640px) {
        .card {
          width: min(520px, calc(100vw - 36px));
          padding: 28px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page" id="page">
      <div class="viz-shell">
        <iframe
          id="viz-frame"
          class="viz-frame"
          src="./index.html"
          title="How Modern Music Resurrects the Past"
        ></iframe>
      </div>
      <div id="viz-cover" style="
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #fafaf8;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
        z-index: 5;
      "></div>
      <div id="click-blocker" style="
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        z-index: 8;
        background: transparent;
        pointer-events: all;
      " onwheel="return false"></div>

      <main class="card-shell">
        <article class="card" id="card">
          <div class="step-counter is-hidden" id="step-counter"></div>
          <button type="button" class="skip-link" id="skip-link">Skip Intro →</button>
          <h2 id="card-title"></h2>
          <p id="card-body"></p>
          <div class="stat" id="card-stat"></div>
          <button type="button" class="explore-button" id="explore-button">Explore the Data →</button>
          <div class="card-nav">
            <button type="button" class="nav-button is-back" id="back-button">← Back</button>
            <button type="button" class="nav-button is-next" id="next-button">Next →</button>
          </div>
        </article>
      </main>
    </div>

    <script>
      const steps = [
        {
          year: null,
          song: null,
          artist: null,
          cardPosition: "center",
          title: "Nothing starts from scratch.",
          body: "Many chart hits borrow from older music. Since 2018, we documented 832 connections between today's Top 50 songs and the music they quietly revived.",
          stat: "832 connections. Seven years.",
          statColor: "#e07a5f",
        },
        {
          year: 2025,
          song: "Euphoria",
          artist: "Kendrick Lamar",
          originalSong: "Don't Tell A Lie About Me And I Won't Tell The Truth On You",
          cardPosition: "top-left",
          title: "Kendrick reached back 51 years.",
          body: "Euphoria interpolates a 1974 James Brown record most people have never heard. A diss track anchored in funk older than Drake.",
          stat: "1974 → 2025. 51 years.",
          statColor: "#3d8b8b",
        },
        {
          year: 2025,
          song: "Euphoria",
          artist: "Kendrick Lamar",
          originalSong: "Worst Behavior",
          cardPosition: "top-left",
          title: "He also interpolated his enemy.",
          body: "Euphoria interpolates Drake's own Worst Behavior. Kendrick didn't need Drake's permission since interpolations only require clearing the composition, not the master.",
          stat: "Sampling requires permission. Interpolation doesn't.",
          statColor: "#3d8b8b",
        },
        {
          year: 2020,
          song: "Hardest To Love",
          artist: "The Weeknd",
          originalSong: "Take on Me",
          cardPosition: "bottom-left",
          title: "Take on Me, Part I.",
          body: "In 2020, The Weeknd interpolated a-ha's 1985 synth-pop anthem. The Norwegian new wave track was 35 years old and still had more to give.",
          stat: "a-ha, 1985 → The Weeknd, 2020.",
          statColor: "#3d8b8b",
        },
        {
          year: 2021,
          song: "Blinding Lights",
          artist: "The Weeknd",
          originalSong: "Take on Me",
          cardPosition: "bottom-left",
          title: "Take on Me, Part II.",
          body: "A year later, Blinding Lights — already one of the longest-charting #1s in Billboard history — was also built on Take on Me. Same song. Bigger moment.",
          stat: "90 weeks on chart. #1.",
          statColor: "#3d8b8b",
        },
        {
          year: 2023,
          song: "As It Was",
          artist: "Harry Styles",
          originalSong: "Take on Me",
          cardPosition: "bottom-left",
          title: "Take on Me, Part III.",
          body: "Then Harry Styles sampled it. Three different years and two #1 hits. All reaching back to the same 40-year-old Norwegian synth.",
          stat: "One riff. Two #1s. Three top 25s.",
          statColor: "#e07a5f",
        },
        {
          year: 2021,
          song: "Hold On",
          artist: "Justin Bieber",
          cardPosition: "bottom-left",
          title: "Gotye came out of nowhere.",
          body: "Somebody That I Used To Know was a 2011 indie crossover that nobody predicted would outlast everything around it. Justin Bieber sampled it on Hold On in 2021.",
          stat: "Gotye, 2011 → Bieber, 2021 → Doechii, 2025.",
          statColor: "#3d8b8b",
        },
        {
          year: 2025,
          song: "Anxiety",
          artist: "Doechii",
          originalSong: "Somebody That I Used To Know",
          cardPosition: "bottom-left",
          title: "And Doechii made it a duo.",
          body: "Then Doechii came back for it in 2025. Doechii sampled Somebody That I Used To Know on Anxiety. Two artists across four years independently reaching for the same unexpected source. Yet neither were able to match Gotye's #1 hit.",
          stat: "Gotye, 2011 → Bieber, 2021 → Doechii, 2025.",
          statColor: "#e07a5f",
        },
        {
          year: 2020,
          song: "HIGHEST IN THE ROOM",
          artist: "Travis Scott",
          cardPosition: "bottom-left",
          title: "Pink Floyd never charted with this.",
          body: "Welcome to the Machine never appeared on the Billboard Hot 100. Travis Scott interpolated it on HIGHEST IN THE ROOM and took it straight to #1.",
          stat: "Never charted → #1.",
          statColor: "#3d8b8b",
        },
        {
          year: null,
          song: null,
          artist: null,
          cardPosition: "center",
          title: "Now explore yourself!",
          body: "Every connection in this chart is real. Filter by year, hover any node, follow any arc. The past is always closer than it looks.",
          stat: null,
          statColor: "#e07a5f",
        },
      ];

      const pageNode = document.getElementById("page");
      const cardShellNode = document.querySelector(".card-shell");
      const frameNode = document.getElementById("viz-frame");
      const vizCoverNode = document.getElementById("viz-cover");
      const clickBlockerNode = document.getElementById("click-blocker");
      const cardNode = document.getElementById("card");
      const titleNode = document.getElementById("card-title");
      const bodyNode = document.getElementById("card-body");
      const statNode = document.getElementById("card-stat");
      const stepCounterNode = document.getElementById("step-counter");
      const backButton = document.getElementById("back-button");
      const nextButton = document.getElementById("next-button");
      const exploreButton = document.getElementById("explore-button");
      const skipLink = document.getElementById("skip-link");
      let vizAPI = null;
      let activeStepIndex = 0;
      let isTransitioning = false;
      let isExploring = false;
      const cardPositions = [
        { top: "50%", left: "50%", right: "auto", bottom: "auto", transform: "translate(-50%, -50%)" },
        { top: "200px", left: "50%", right: "auto", bottom: "auto", transform: "translateX(-50%)" },
        { top: "350px", left: "50%", right: "auto", bottom: "auto", transform: "translateX(-50%)" },
        { top: "450px", left: "50%", right: "auto", bottom: "auto", transform: "translateX(-50%)" },
        { top: "380px", left: "50%", right: "auto", bottom: "auto", transform: "translateX(-50%)" },
        { top: "300px", left: "35%", right: "auto", bottom: "auto", transform: "translateX(-50%)" },
        { top: "380px", left: "50%", right: "auto", bottom: "auto", transform: "translateX(-50%)" },
        { top: "50%", left: "50%", right: "auto", bottom: "auto", transform: "translate(-50%, -50%)" },
        { top: "300px", left: "50%", right: "auto", bottom: "auto", transform: "translateX(-50%)" },
        { top: "50%", left: "50%", right: "auto", bottom: "auto", transform: "translate(-50%, -50%)" },
      ];

      function getVizAPI() {
        return frameNode.contentWindow?.vizAPI || null;
      }

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function waitForVizAPI() {
        while (!getVizAPI()) {
          await wait(120);
        }
        vizAPI = getVizAPI();
        return vizAPI;
      }

      function setFrameScrollyMode(active) {
        if (frameNode.contentWindow) {
          frameNode.contentWindow.SCROLLY_MODE = Boolean(active);
        }
      }

      function renderCard(index) {
        const step = steps[index];
        const position = cardPositions[index] || cardPositions[0];
        const resolvedTop =
          position.top && position.top.endsWith("px")
            ? `${Math.max(80, Number.parseFloat(position.top) || 0)}px`
            : position.top;
        cardNode.style.top = resolvedTop;
        cardNode.style.left = position.left;
        cardNode.style.right = position.right;
        cardNode.style.bottom = position.bottom;
        cardNode.style.transform = position.transform;
        titleNode.textContent = step.title;
        bodyNode.textContent = step.body;

        if (index === 0) {
          stepCounterNode.textContent = "";
          stepCounterNode.classList.add("is-hidden");
        } else {
          stepCounterNode.textContent = `${index} / ${steps.length - 1}`;
          stepCounterNode.classList.remove("is-hidden");
        }

        skipLink.style.display = index === steps.length - 1 ? "none" : "";

        if (step.stat) {
          statNode.textContent = step.stat;
          statNode.style.color = step.statColor || "#e07a5f";
          statNode.style.backgroundColor = `${step.statColor || "#e07a5f"}1f`;
          statNode.style.border = `1px solid ${step.statColor || "#e07a5f"}`;
          statNode.style.display = "inline-flex";
          statNode.hidden = false;
        } else {
          statNode.style.display = "none";
          statNode.hidden = true;
        }

        backButton.classList.toggle("is-hidden", index === 0);
        if (index === steps.length - 1) {
          nextButton.classList.add("is-hidden");
          exploreButton.classList.add("is-visible");
          return;
        }

        exploreButton.classList.remove("is-visible");
        nextButton.textContent = "Next →";
        nextButton.classList.toggle("is-hidden", false);
      }

      async function callVizAPI(methodName, ...args) {
        try {
          const api = await waitForVizAPI();
          const method = api?.[methodName];
          if (typeof method === "function") {
            method(...args);
          }
        } catch (error) {
          console.error(`vizAPI.${methodName} failed`, error);
        }
      }

      async function syncVizToStep(index) {
        const step = steps[index];

        if (index === 0) {
          setFrameScrollyMode(true);
          await callVizAPI("clearFocus");
          return;
        }

        setFrameScrollyMode(true);

        if (index === steps.length - 1) {
          setFrameScrollyMode(false);
          await callVizAPI("clearFocus");
          await callVizAPI("setYear", 2025);
          return;
        }

        await callVizAPI("setYear", step.year);
        await wait(320);
        if (step.originalSong) {
          await callVizAPI("focusConnection", step.song, step.originalSong);
          return;
        }

        await callVizAPI("focusSong", step.song, step.artist);
      }

      async function exitScrolly() {
        if (isExploring) {
          return;
        }

        isExploring = true;
        await callVizAPI("clearFocus");
        setFrameScrollyMode(false);
        await callVizAPI("setScrollyMode", false);
        await callVizAPI("setYear", 2025);
        clickBlockerNode.style.display = "none";
        cardNode.style.opacity = "0";
        cardNode.style.pointerEvents = "none";
        cardShellNode.style.opacity = "0";
        cardShellNode.style.pointerEvents = "none";
        cardShellNode.style.display = "none";
        pageNode.classList.add("is-exploring");
      }

      async function goToStep(index) {
        if (isExploring || isTransitioning || index < 0 || index >= steps.length || index === activeStepIndex) {
          return;
        }

        isTransitioning = true;
        try {
          const previousYear = steps[activeStepIndex]?.year ?? null;
          const nextYear = steps[index]?.year ?? null;
          const useCover = previousYear !== nextYear;

          if (useCover) {
            cardNode.style.opacity = "0";
            vizCoverNode.style.opacity = "1";
            await wait(150);
            await syncVizToStep(index);
            activeStepIndex = index;
            renderCard(activeStepIndex);
            await wait(300);
            cardNode.style.opacity = "1";
            vizCoverNode.style.opacity = "0";
            await wait(150);
            return;
          }

          await syncVizToStep(index);
          activeStepIndex = index;
          renderCard(activeStepIndex);
        } finally {
          isTransitioning = false;
        }
      }

      backButton.addEventListener("click", () => {
        goToStep(activeStepIndex - 1);
      });

      nextButton.addEventListener("click", () => {
        goToStep(activeStepIndex + 1);
      });

      exploreButton.addEventListener("click", () => {
        exitScrolly();
      });

      skipLink.addEventListener("click", (event) => {
        event.preventDefault();
        exitScrolly();
      });

      window.addEventListener("keydown", (event) => {
        if (isExploring) {
          return;
        }

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          goToStep(activeStepIndex - 1);
          return;
        }

        if (event.key === "ArrowRight") {
          event.preventDefault();
          goToStep(activeStepIndex + 1);
        }
      });

      renderCard(activeStepIndex);

      frameNode.addEventListener("load", () => {
        setFrameScrollyMode(true);
        syncVizToStep(activeStepIndex);
      });
    </script>
  </body>
</html>
