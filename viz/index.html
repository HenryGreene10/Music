<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How Modern Music Resurrects the Past</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafaf8;
        --text: #1f1f1b;
        --muted: #666666;
        --hairline: rgba(31, 31, 27, 0.1);
        --warm: #e07a5f;
        --cool: #4a7fa5;
        --cool-soft: #a0b8c8;
        --sample: #e07a5f;
        --interpolate: #3d8b8b;
        --cover: #9b72aa;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      .page {
        display: grid;
        grid-template-rows: 100px 1fr;
        width: 100vw;
        min-height: 100vh;
      }

      .header {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: 18px 28px 14px;
      }

      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .title-block {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: clamp(26px, 3.1vw, 40px);
        line-height: 0.98;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 0;
        color: #707070;
        font-size: 13px;
        line-height: 1.35;
      }

      .header-legend {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 16px;
        color: #999999;
        font-size: 11px;
        white-space: nowrap;
      }

      .header-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .header-legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        flex: 0 0 auto;
      }

      .header-legend-stroke {
        width: 14px;
        height: 0;
        border-top: 2px solid currentColor;
        border-radius: 999px;
        flex: 0 0 auto;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-width: 0;
      }

      .filters {
        display: flex;
        gap: 8px;
        min-width: 0;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .filters::-webkit-scrollbar {
        display: none;
      }

      .year-button {
        flex: 0 0 auto;
        border: 1px solid rgba(31, 31, 27, 0.15);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #666666;
        padding: 5px 12px;
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          background 180ms ease,
          color 180ms ease,
          border-color 180ms ease;
      }

      .year-button:hover {
        background: rgba(224, 122, 95, 0.08);
        border-color: rgba(224, 122, 95, 0.35);
      }

      .year-button.is-active {
        background: #1f1f1b;
        border-color: #1f1f1b;
        color: #ffffff;
      }

      .counter {
        flex: 0 0 auto;
        color: #7a7a7a;
        font-size: 11px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .chart-shell {
        display: grid;
        grid-template-columns: minmax(280px, 32%) minmax(0, 1fr);
        gap: 20px;
        padding: 0 24px 24px;
        height: calc(100vh - 100px);
        min-height: calc(100vh - 100px);
      }

      .browser-panel,
      .chart-panel {
        min-height: 0;
        height: 100%;
      }

      .browser-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        border: 1px solid rgba(31, 31, 27, 0.08);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.55);
      }

      .browser-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        color: #666666;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .browser-subtle {
        color: #9a9a9a;
        letter-spacing: 0;
        text-transform: none;
      }

      .revival-browser {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
        overflow-y: auto;
        padding-right: 4px;
      }

      .browser-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        width: 100%;
        border: 1px solid rgba(31, 31, 27, 0.08);
        border-radius: 14px;
        background: rgba(250, 250, 248, 0.85);
        padding: 10px 12px;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 160ms ease,
          background 160ms ease,
          transform 160ms ease;
      }

      .browser-row:hover {
        border-color: rgba(31, 31, 27, 0.18);
        background: rgba(255, 255, 255, 0.95);
        transform: translateX(2px);
      }

      .browser-row.is-active {
        border-color: rgba(31, 31, 27, 0.3);
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 10px 20px rgba(31, 31, 27, 0.06);
      }

      .browser-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        flex: 0 0 auto;
      }

      .browser-copy {
        min-width: 0;
      }

      .browser-song {
        display: block;
        color: #20201c;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
      }

      .browser-meta {
        display: block;
        margin-top: 2px;
        color: #8a8a8a;
        font-size: 11px;
        line-height: 1.35;
      }

      .browser-stats {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        white-space: nowrap;
      }

      .browser-peak {
        color: #20201c;
        font-size: 12px;
        font-weight: 700;
      }

      .browser-weeks {
        color: #9a9a9a;
        font-size: 10px;
      }

      .chart-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(31, 31, 27, 0.06);
        border-radius: 18px;
        background: rgba(250, 250, 248, 0.72);
        overflow: hidden;
      }

      .chart-canvas {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }

      #chart {
        width: 100%;
        height: 100%;
      }

      .chart-empty-state {
        position: absolute;
        inset: 0;
      }

      #chart,
      svg {
        width: 100%;
        height: 100%;
        display: block;
        background: var(--bg);
        overflow: visible;
      }

      .arc {
        fill: none;
        opacity: 0.8;
        stroke-linecap: round;
        pointer-events: stroke;
      }

      .revival-mark,
      .original-mark {
        cursor: pointer;
      }

      .revival-mark text {
        font-size: 9px;
        pointer-events: none;
      }

      .revival-mark .song-label {
        fill: #333333;
        font-weight: 600;
      }

      .revival-mark .artist-label {
        fill: #999999;
      }

      .revival-mark .peak-label {
        fill: #e07a5f;
        font-size: 11px;
        font-weight: 700;
      }

      .inline-label {
        pointer-events: none;
        opacity: 0;
      }

      .inline-label rect {
        fill: rgba(255, 255, 255, 0.96);
        rx: 4px;
        ry: 4px;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.12));
      }

      .inline-label .song {
        font-size: 9px;
        font-weight: 700;
      }

      .inline-label .artist {
        font-size: 9px;
        fill: #999999;
      }

      .inline-label .year {
        font-size: 10px;
        fill: #999999;
      }

      .inline-label .peak {
        font-size: 11px;
        font-weight: 700;
        fill: #e07a5f;
      }

      .inline-label.original .song,
      .inline-label.original .artist {
        fill: #4a7fa5;
      }

      .story-text {
        pointer-events: none;
      }

      .story-text .song {
        font-size: 18px;
        font-weight: 700;
        fill: #1f1f1b;
      }

      .story-text .meta {
        font-size: 13px;
        fill: #7a7a7a;
      }

      .story-text .peak {
        font-size: 15px;
        font-weight: 700;
        fill: #e07a5f;
      }

      .empty-state {
        display: grid;
        place-items: center;
        height: 100%;
        color: #9a9a9a;
        font-size: 14px;
      }

      @media (max-width: 720px) {
        .header {
          padding: 16px 16px 12px;
        }

        .header-top {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }

        .counter {
          font-size: 10px;
        }

        .year-button {
          padding: 5px 10px;
        }

        .chart-shell {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 0;
          padding: 0 16px 16px;
        }

        .browser-panel {
          max-height: 38vh;
        }

        .chart-panel {
          min-height: 56vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-top">
          <div class="title-block">
            <h1>How Modern Music Resurrects the Past</h1>
            <p class="subtitle">Bubble size = chart peak. Arc length = how far back it reached. Height = weeks on chart.</p>
          </div>
          <div class="header-legend" aria-label="Legend">
            <span class="header-legend-item"><span class="header-legend-dot" style="background: #e07a5f"></span><span>This year's hit</span></span>
            <span class="header-legend-item"><span class="header-legend-dot" style="background: #4a7fa5"></span><span>Original song sampled</span></span>
            <span class="header-legend-item"><span>Longer arc = older sample</span></span>
            <span class="header-legend-item" style="color: #e07a5f"><span class="header-legend-stroke"></span><span>Samples</span></span>
            <span class="header-legend-item" style="color: #3d8b8b"><span class="header-legend-stroke"></span><span>Interpolates</span></span>
            <span class="header-legend-item" style="color: #9b72aa"><span class="header-legend-stroke"></span><span>Cover</span></span>
          </div>
        </div>
        <div class="controls">
          <div id="filters" class="filters" aria-label="Year filters"></div>
          <div id="counter" class="counter"></div>
        </div>
      </header>

      <section class="chart-shell">
        <aside class="browser-panel" aria-label="Revival browser">
          <div class="browser-heading">
            <span>Revival Browser</span>
            <span id="browser-count" class="browser-subtle"></span>
          </div>
          <div id="revival-browser" class="revival-browser"></div>
        </aside>

        <div id="chart-panel" class="chart-panel">
          <div id="chart-canvas" class="chart-canvas">
            <div id="chart" aria-label="Music sample connections chart"></div>
            <div id="chart-empty" class="empty-state chart-empty-state">
              Select a revival song to see how it connects to the past.
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const YEAR_OPTIONS = ["ALL", 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025];
      const DEFAULT_YEAR = 2024;
      const RELATIONSHIP_COLOR = {
        samples: "#E07A5F",
        interpolates: "#3D8B8B",
        cover: "#9B72AA"
      };

      const chartNode = document.getElementById("chart");
      const chartPanelNode = document.getElementById("chart-panel");
      const chartCanvasNode = document.getElementById("chart-canvas");
      const chartEmptyNode = document.getElementById("chart-empty");
      const filtersNode = document.getElementById("filters");
      const counterNode = document.getElementById("counter");
      const browserNode = document.getElementById("revival-browser");
      const browserCountNode = document.getElementById("browser-count");

      let allRows = [];
      let activeYear = DEFAULT_YEAR;
      let selectedRevivalKey = null;
      let lockedId = null;
      let svg;
      let rootLayer;
      let arcLayer;
      let originalLayer;
      let revivalLayer;
      let labelLayer;
      let revivalLabel;
      let originalLabelsLayer;
      let arcSelection = d3.select(null);
      let originalSelection = d3.select(null);
      let revivalSelection = d3.select(null);
      let resizeTimer;

      function truncate(text, maxLength = 25) {
        return text.length > maxLength ? `${text.slice(0, maxLength - 1).trimEnd()}…` : text;
      }

      function getRevivalKey(row) {
        return `${row.revivalSong}__${row.revivalArtist}`.toLowerCase();
      }

      function getOriginalKey(row) {
        return `${row.originalSong}__${row.originalArtist}`.toLowerCase();
      }

      function revivalSort(a, b) {
        return (
          d3.ascending(a.revivalPeak, b.revivalPeak) ||
          d3.descending(a.revivalWeeksOnChart, b.revivalWeeksOnChart) ||
          d3.descending(a.revivalSpotifyPopularity, b.revivalSpotifyPopularity) ||
          d3.ascending(a.revivalSong, b.revivalSong) ||
          d3.ascending(a.revivalArtist, b.revivalArtist)
        );
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function weeksRadius(weeks) {
        if (!Number.isFinite(weeks) || weeks <= 0) {
          return 5;
        }

        return clamp(5 + (weeks / 112) * 28, 5, 33);
      }

      function originalRadius(row) {
        return row.everCharted ? weeksRadius(row.originalWeeksOnChart) : 5;
      }

      function peakLabel(peak) {
        return Number.isFinite(peak) ? `#${Math.round(peak)}` : "uncharted";
      }

      function colorWithOpacity(color, opacity) {
        const parsed = d3.color(color);
        if (!parsed) {
          return color;
        }

        parsed.opacity = opacity;
        return `${parsed}`;
      }

      function setInlineLabel(label, lines, x, y, anchor, className) {
        label.attr("class", `inline-label ${className}`);

        const text = label.select("text").attr("text-anchor", anchor);
        const tspans = text.selectAll("tspan").data(lines);

        tspans
          .join("tspan")
          .attr("class", (_, index) => (index === 0 ? "song" : index === 1 ? "artist" : index === 2 ? "year" : "peak"))
          .attr("x", x)
          .attr("dy", (_, index) => (index === 0 ? 0 : 12))
          .text((d) => d);

        label.style("opacity", 1);

        const bbox = text.node().getBBox();
        const paddingX = 8;
        const paddingY = 4;

        label
          .select("rect")
          .attr("x", bbox.x - paddingX)
          .attr("y", bbox.y - paddingY)
          .attr("width", bbox.width + paddingX * 2)
          .attr("height", bbox.height + paddingY * 2);

        label.attr("transform", `translate(0,${y - (bbox.y + bbox.height / 2)})`);
      }

      function showInlineLabels(link, originalItems = [link]) {
        setInlineLabel(
          revivalLabel,
          [link.revivalSong, link.revivalArtist, String(link.revivalChartYear), peakLabel(link.revivalPeak)],
          link.revivalX - link.revivalR - 12,
          link.revivalY,
          "end",
          "revival"
        );

        const originalLabels = originalLabelsLayer
          .selectAll("g.original-inline-label")
          .data(originalItems, (d) => d.id)
          .join(
            (enter) => {
              const group = enter.append("g");
              group.append("rect").attr("rx", 4).attr("ry", 4);
              group.append("text");
              return group;
            },
            (update) => update,
            (exit) => exit.remove()
          );

        originalLabels.each(function (item) {
          setInlineLabel(
            d3.select(this),
            [item.originalSong, item.originalArtist, String(item.originalReleaseYear), peakLabel(item.originalPeakDisplay)],
            item.originalX + item.originalR + 12,
            item.originalY,
            "start",
            "original original-inline-label"
          );
        });
      }

      function hideInlineLabels() {
        revivalLabel.style("opacity", 0);
        originalLabelsLayer.selectAll("g.original-inline-label").remove();
      }

      function setChartEmptyState(isVisible) {
        chartEmptyNode.hidden = !isVisible;
        chartEmptyNode.style.display = isVisible ? "grid" : "none";
        if (svg) {
          svg.style("display", isVisible ? "none" : "block");
        }
      }

      function buildBrowserData(rows) {
        const revivalColorMap = buildRevivalColorMap(rows);
        return Array.from(d3.group(rows, (row) => getRevivalKey(row)), ([revivalKey, group]) => {
          const first = group[0];
          return {
            revivalKey,
            revivalSong: first.revivalSong,
            revivalArtist: first.revivalArtist,
            revivalChartYear: first.revivalChartYear,
            revivalPeak: first.revivalPeak,
            revivalWeeksOnChart: first.revivalWeeksOnChart,
            revivalSpotifyPopularity: first.revivalSpotifyPopularity,
            relationshipType: first.relationshipType,
            revivalColor: revivalColorMap.get(revivalKey) || RELATIONSHIP_COLOR[first.relationshipType],
            originalsCount: group.length
          };
        }).sort(revivalSort);
      }

      function renderBrowser(browserData) {
        browserCountNode.textContent = `${browserData.length} songs`;

        const browserSelection = d3.select(browserNode)
          .selectAll("button.browser-row")
          .data(browserData, (d) => d.revivalKey);

        browserSelection
          .join(
            (enter) => {
              const button = enter
                .append("button")
                .attr("type", "button")
                .attr("class", "browser-row");

              button.append("span").attr("class", "browser-dot");

              const copy = button.append("span").attr("class", "browser-copy");
              copy.append("span").attr("class", "browser-song");
              copy.append("span").attr("class", "browser-meta");

              const stats = button.append("span").attr("class", "browser-stats");
              stats.append("span").attr("class", "browser-peak");
              stats.append("span").attr("class", "browser-weeks");

              return button;
            },
            (update) => update,
            (exit) => exit.remove()
          )
          .classed("is-active", (d) => d.revivalKey === selectedRevivalKey)
          .attr("aria-pressed", (d) => (d.revivalKey === selectedRevivalKey ? "true" : "false"))
          .on("click", (_, revival) => {
            selectedRevivalKey = revival.revivalKey;
            lockedId = null;
            hideInlineLabels();
            render(true);
          });

        const rows = d3.select(browserNode).selectAll("button.browser-row");

        rows.select(".browser-dot")
          .style("background", (d) => d.revivalColor);

        rows.select(".browser-song")
          .text((d) => d.revivalSong);

        rows.select(".browser-meta")
          .text((d) => `${d.revivalArtist} • ${d.revivalChartYear}`);

        rows.select(".browser-peak")
          .text((d) => `#${d.revivalPeak}`);

        rows.select(".browser-weeks")
          .text((d) => `${d.revivalWeeksOnChart} weeks`);

        const activeRow = browserNode.querySelector("button.browser-row.is-active");
        activeRow?.scrollIntoView({ block: "nearest" });
      }

      function buildButtons() {
        filtersNode.innerHTML = "";

        YEAR_OPTIONS.forEach((year) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "year-button";
          button.dataset.year = String(year);
          button.textContent = String(year);
          button.addEventListener("click", () => {
            if (activeYear === year) {
              return;
            }

            activeYear = year;
            selectedRevivalKey = null;
            lockedId = null;
            hideInlineLabels();
            render(true);
          });
          filtersNode.appendChild(button);
        });
      }

      function updateButtons() {
        filtersNode.querySelectorAll(".year-button").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.year === String(activeYear));
        });
      }

      function filteredRows() {
        return activeYear === "ALL"
          ? allRows.slice()
          : allRows.filter((row) => row.revivalChartYear === activeYear);
      }

      function buildRevivalColorMap(rows) {
        const uniqueRevivals = new Map();

        rows.forEach((row) => {
          const key = getRevivalKey(row);
          if (!uniqueRevivals.has(key)) {
            uniqueRevivals.set(key, row);
          }
        });

        const colorMap = new Map();
        const grouped = d3.group([...uniqueRevivals.entries()], ([, row]) => row.relationshipType);

        grouped.forEach((entries, relationshipType) => {
          const sortedEntries = entries.slice().sort(([, a], [, b]) => revivalSort(a, b));

          if (relationshipType === "cover") {
            sortedEntries.forEach(([key]) => colorMap.set(key, "#9B72AA"));
            return;
          }

          const interpolator =
            relationshipType === "interpolates"
              ? d3.interpolateRgb("#3D8B8B", "#5B7FA6")
              : d3.interpolateRgb("#E07A5F", "#C45C8A");

          sortedEntries.forEach(([key], index) => {
            const t = sortedEntries.length === 1 ? 0.5 : index / (sortedEntries.length - 1);
            colorMap.set(key, interpolator(t));
          });
        });

        return colorMap;
      }

      function computeStoryLayout(rows, width, height) {
        const centerY = height / 2;
        const revivalX = Math.min(width - 220, width * 0.72);
        const revivalY = centerY;
        const revivalR = 26;
        const originalX = Math.max(150, width * 0.2);
        const sortedRows = rows
          .slice()
          .sort(
            (a, b) =>
              d3.ascending(a.originalReleaseYear, b.originalReleaseYear) ||
              d3.ascending(a.originalSong, b.originalSong) ||
              d3.ascending(a.originalArtist, b.originalArtist)
          );
        const spacing =
          sortedRows.length <= 1
            ? 0
            : Math.min(96, Math.max(68, (height * 0.5) / (sortedRows.length - 1)));
        const revivalColorMap = buildRevivalColorMap(rows);

        return sortedRows.map((row, index) => {
          const revivalKey = getRevivalKey(row);
          const originalKey = getOriginalKey(row);
          const originalR = row.everCharted ? 16 : 14;
          const originalY = clamp(
            centerY + (index - (sortedRows.length - 1) / 2) * spacing,
            110,
            height - 110
          );
          const revivalColor = revivalColorMap.get(revivalKey) || RELATIONSHIP_COLOR[row.relationshipType];
          const originalColor = revivalColor;
          const startX = originalX + originalR;
          const endX = revivalX - revivalR;
          const cp1x = originalX + (revivalX - originalX) * 0.42;
          const cp2x = originalX + (revivalX - originalX) * 0.78;

          return {
            ...row,
            revivalKey,
            originalKey,
            revivalX,
            revivalY,
            revivalR,
            originalX,
            originalY,
            originalR,
            revivalColor,
            originalColor,
            stroke: revivalColor,
            strokeWidth: clamp(3 + (row.yearsBetween / 90) * 1.1, 3, 4.1),
            path: `M${startX},${originalY} C${cp1x},${originalY} ${cp2x},${revivalY} ${endX},${revivalY}`
          };
        });
      }

      function pulseOriginal(id) {
        const target = originalSelection.filter((d) => d.id === id);

        target
          .interrupt()
          .transition()
          .duration(180)
          .attrTween("transform", (d) => {
            const interpolate = d3.interpolateNumber(1, 1.5);
            return (t) => `translate(${d.originalX},${d.originalY}) scale(${interpolate(t)})`;
          })
          .transition()
          .duration(220)
          .attrTween("transform", (d) => {
            const interpolate = d3.interpolateNumber(1.5, 1);
            return (t) => `translate(${d.originalX},${d.originalY}) scale(${interpolate(t)})`;
          });
      }

      function resetFocus() {
        const t = d3.transition().duration(200);
        arcSelection.transition(t).style("opacity", 0.8);
        revivalSelection.transition(t).style("opacity", 1);
        originalSelection.transition(t).style("opacity", 1);
        hideInlineLabels();
      }

      function applyFocus(link, pulse = false) {
        const t = d3.transition().duration(200);
        arcSelection
          .transition(t)
          .style("opacity", (d) => (d.id === link.id ? 1 : 0.18));

        arcSelection
          .filter((d) => d.id === link.id)
          .raise();

        revivalSelection
          .transition(t)
          .style("opacity", 1);

        revivalSelection
          .filter((d) => d.revivalKey === link.revivalKey)
          .raise();

        originalSelection
          .transition(t)
          .style("opacity", (d) => (d.id === link.id ? 1 : 0.25));

        originalSelection
          .filter((d) => d.id === link.id)
          .raise();

        if (pulse) {
          pulseOriginal(link.id);
        }

        showInlineLabels(link);
      }

      function applyRevivalFocus(revival, pulse = false) {
        const relatedIds = new Set(revival.originals.map((item) => item.id));
        const t = d3.transition().duration(200);

        arcSelection
          .transition(t)
          .style("opacity", (d) => (relatedIds.has(d.id) ? 0.95 : 0.18));

        arcSelection
          .filter((d) => relatedIds.has(d.id))
          .raise();

        revivalSelection
          .transition(t)
          .style("opacity", 1);

        revivalSelection
          .filter((d) => d.revivalKey === revival.revivalKey)
          .raise();

        originalSelection
          .transition(t)
          .style("opacity", (d) => (relatedIds.has(d.id) ? 1 : 0.25));

        originalSelection
          .filter((d) => relatedIds.has(d.id))
          .raise();

        if (pulse) {
          revival.originals.forEach((item) => {
            pulseOriginal(item.id);
          });
        }

        console.log("hover originals length", revival.originals.length);
        showInlineLabels(revival.originals[0], revival.originals);
      }

      function bindInteraction(selection) {
        selection
          .on("mouseenter", function (event, link) {
            if (lockedId && lockedId !== link.id) {
              return;
            }

            d3.select(this).raise();
            applyFocus(link, !lockedId);
          })
          .on("mouseleave", function () {
            if (!lockedId) {
              resetFocus();
            }
          })
          .on("click", function (event, link) {
            event.stopPropagation();
            lockedId = link.id;
            d3.select(this).raise();
            applyFocus(link, false);
          });
      }

      function ensureSvg(width, height) {
        d3.select(chartNode).selectAll(".empty-state").remove();

        if (!svg) {
          svg = d3.select(chartNode).append("svg");
          rootLayer = svg.append("g");
          arcLayer = rootLayer.append("g");
          originalLayer = rootLayer.append("g");
          revivalLayer = rootLayer.append("g");
          labelLayer = rootLayer.append("g");

          revivalLabel = labelLayer.append("g");
          revivalLabel.append("rect").attr("rx", 4).attr("ry", 4);
          revivalLabel.append("text");

          originalLabelsLayer = labelLayer.append("g");

          svg.on("click", () => {
            if (!lockedId) {
              return;
            }

            lockedId = null;
            resetFocus();
          });
        }

        svg
          .attr("width", width)
          .attr("height", height)
          .attr("viewBox", `0 0 ${width} ${height}`)
          .attr("preserveAspectRatio", "xMidYMid meet")
          .style("width", `${width}px`)
          .style("height", `${height}px`);
      }

      function render(animate) {
        const browserRows = filteredRows();
        const browserData = buildBrowserData(browserRows);
        const selectionExists = selectedRevivalKey && browserData.some((revival) => revival.revivalKey === selectedRevivalKey);
        if (!selectionExists) {
          selectedRevivalKey = null;
        }

        const rows = selectedRevivalKey
          ? browserRows.filter((row) => getRevivalKey(row) === selectedRevivalKey)
          : [];

        const width = Math.max(chartCanvasNode.clientWidth, 320);
        const height = Math.max(chartCanvasNode.clientHeight, 420);

        chartCanvasNode.style.height = `${height}px`;
        renderBrowser(browserData);
        counterNode.textContent = `Showing ${browserData.length} songs`;
        updateButtons();

        ensureSvg(width, height);

        svg.selectAll(".arc").remove();
        svg.selectAll("g.original-mark").remove();
        svg.selectAll("g.revival-mark").remove();
        svg.selectAll(".inline-label").remove();

        arcLayer.selectAll("*").remove();
        originalLayer.selectAll("*").remove();
        revivalLayer.selectAll("*").remove();
        labelLayer.selectAll("*").remove();

        revivalLabel = labelLayer.append("g");
        revivalLabel.append("rect").attr("rx", 4).attr("ry", 4);
        revivalLabel.append("text");
        originalLabelsLayer = labelLayer.append("g");

        arcSelection = arcLayer.selectAll("path.arc");
        originalSelection = originalLayer.selectAll("g.original-mark");
        revivalSelection = revivalLayer.selectAll("g.revival-mark");

        if (!rows.length) {
          setChartEmptyState(true);
          return;
        }

        setChartEmptyState(false);

        const laidOut = computeStoryLayout(rows, width, height);
        const transition = d3.transition().duration(animate ? 320 : 0);

        const groupedRevivals = Array.from(d3.group(laidOut, (d) => d.revivalKey), ([revivalKey, originals]) => {
          const first = originals[0];
          return {
            revivalKey,
            id: `revival:${revivalKey}`,
            revivalSong: first.revivalSong,
            revivalArtist: first.revivalArtist,
            revivalPeak: first.revivalPeak,
            revivalX: first.revivalX,
            revivalY: first.revivalY,
            revivalR: first.revivalR,
            revivalColor: first.revivalColor,
            originals
          };
        });

        const arcData = groupedRevivals.flatMap((revival) => revival.originals);

        arcSelection = arcLayer.selectAll("path.arc").data(arcData, (d) => d.id);

        arcSelection
          .join(
            (enter) =>
              enter
                .append("path")
                .attr("class", "arc")
                .attr("d", (d) => d.path)
                .attr("stroke", (d) => d.stroke)
                .attr("stroke-width", (d) => d.strokeWidth)
                .style("opacity", 0)
                .call((enterSelection) => enterSelection.transition(transition).style("opacity", 0.8)),
            (update) =>
              update.call((updateSelection) =>
                updateSelection
                  .transition(transition)
                  .attr("d", (d) => d.path)
                  .attr("stroke", (d) => d.stroke)
                  .attr("stroke-width", (d) => d.strokeWidth)
                  .style("opacity", 0.8)
              ),
            (exit) => exit.call((exitSelection) => exitSelection.transition(transition).style("opacity", 0).remove())
          );

        arcSelection = arcLayer.selectAll("path.arc");

        originalSelection = originalLayer.selectAll("g.original-mark").data(laidOut, (d) => d.id);

        originalSelection
          .join(
            (enter) => {
              const group = enter
                .append("g")
                .attr("class", (d) => `original-mark ${d.everCharted ? "charted" : "uncharted"}`)
                .attr("transform", (d) => `translate(${d.originalX},${d.originalY}) scale(1)`)
                .style("opacity", 0);

              group
                .append("circle")
                .attr("r", (d) => d.originalR)
                .attr("fill", (d) => d.originalColor)
                .attr("fill-opacity", 0.78)
                .attr("stroke", (d) => colorWithOpacity(d.originalColor, 0.45))
                .attr("stroke-width", 1.5);

              const text = group.append("text").attr("class", "story-text").attr("text-anchor", "end");
              text.append("tspan").attr("class", "song");
              text.append("tspan").attr("class", "meta");
              text.append("tspan").attr("class", "peak");

              group.call((enterSelection) => enterSelection.transition(transition).style("opacity", 1));
              return group;
            },
            (update) =>
              update.call((updateSelection) =>
                updateSelection
                  .transition(transition)
                  .attr("transform", (d) => `translate(${d.originalX},${d.originalY}) scale(1)`)
                  .style("opacity", 1)
              ),
            (exit) => exit.call((exitSelection) => exitSelection.transition(transition).style("opacity", 0).remove())
          );

        originalSelection = originalLayer.selectAll("g.original-mark");
        originalSelection
          .select("circle")
          .transition(transition)
          .attr("r", (d) => d.originalR)
          .attr("fill", (d) => d.originalColor)
          .attr("fill-opacity", 0.78)
          .attr("stroke", (d) => colorWithOpacity(d.originalColor, 0.45));

        originalSelection
          .select("text.story-text")
          .attr("x", (d) => -(d.originalR + 18))
          .attr("y", -20)
          .each(function (d) {
            const tspans = d3.select(this).selectAll("tspan");
            tspans
              .filter(".song")
              .attr("x", -(d.originalR + 18))
              .attr("fill", d.originalColor)
              .text(d.originalSong);
            tspans
              .filter(".meta")
              .attr("x", -(d.originalR + 18))
              .attr("dy", 18)
              .text(`${d.originalArtist} — ${d.originalReleaseYear}`);
            tspans
              .filter(".peak")
              .attr("x", -(d.originalR + 18))
              .attr("dy", 18)
              .text(peakLabel(d.originalPeakDisplay));
          });

        revivalSelection = revivalLayer.selectAll("g.revival-mark").data(groupedRevivals, (d) => d.id);

        revivalSelection
          .join(
            (enter) => {
              const group = enter
                .append("g")
                .attr("class", "revival-mark")
                .attr("transform", (d) => `translate(${d.revivalX},${d.revivalY})`)
                .style("opacity", 0);

              group
                .append("circle")
                .attr("r", (d) => d.revivalR)
                .attr("fill", (d) => d.revivalColor)
                .attr("fill-opacity", 0.9)
                .attr("stroke", (d) => d.revivalColor)
                .attr("stroke-width", 2);

              const text = group.append("text").attr("class", "story-text").attr("text-anchor", "start");
              text.append("tspan").attr("class", "song");
              text.append("tspan").attr("class", "meta");
              text.append("tspan").attr("class", "peak");

              group.call((enterSelection) => enterSelection.transition(transition).style("opacity", 1));
              return group;
            },
            (update) =>
              update.call((updateSelection) =>
                updateSelection
                  .transition(transition)
                  .attr("transform", (d) => `translate(${d.revivalX},${d.revivalY})`)
                  .style("opacity", 1)
              ),
            (exit) => exit.call((exitSelection) => exitSelection.transition(transition).style("opacity", 0).remove())
          );

        revivalSelection = revivalLayer.selectAll("g.revival-mark");
        revivalSelection
          .select("circle")
          .transition(transition)
          .attr("r", (d) => d.revivalR)
          .attr("fill", (d) => d.revivalColor)
          .attr("stroke", (d) => d.revivalColor);

        revivalSelection
          .select("text.story-text")
          .attr("x", (d) => d.revivalR + 18)
          .attr("y", -22)
          .each(function (d) {
            const tspans = d3.select(this).selectAll("tspan");
            tspans
              .filter(".song")
              .attr("x", d.revivalR + 18)
              .attr("fill", d.revivalColor)
              .text(d.revivalSong);
            tspans
              .filter(".meta")
              .attr("x", d.revivalR + 18)
              .attr("dy", 18)
              .text(`${d.revivalArtist} — ${d.revivalChartYear}`);
            tspans
              .filter(".peak")
              .attr("x", d.revivalR + 18)
              .attr("dy", 18)
              .text(peakLabel(d.revivalPeak));
          });

        bindInteraction(arcSelection);
        bindInteraction(originalSelection);

        revivalSelection
          .on("mouseenter", function (event, revival) {
            if (lockedId && lockedId !== revival.id) {
              return;
            }

            d3.select(this).raise();
            applyRevivalFocus(revival, !lockedId);
          })
          .on("mouseleave", function () {
            if (!lockedId) {
              resetFocus();
            }
          })
          .on("click", function (event, revival) {
            event.stopPropagation();
            lockedId = revival.id;
            d3.select(this).raise();
            applyRevivalFocus(revival, false);
          });

        if (lockedId) {
          const lockedRevival = groupedRevivals.find((revival) => revival.id === lockedId);
          if (lockedRevival) {
            applyRevivalFocus(lockedRevival, false);
          } else {
            const lockedLink = arcData.find((row) => row.id === lockedId);
            if (lockedLink) {
              applyFocus(lockedLink, false);
            } else {
              lockedId = null;
              resetFocus();
            }
          }
        } else {
          resetFocus();
        }
      }

      d3.csv("sample_pairs_clean.csv", (row, index) => {
        const revivalPeak = Number(row.revival_peak);
        const revivalChartYear = Number(row.revival_chart_year);
        const originalPeak = Number(row.original_peak);
        const yearsBetween = Number(row.years_between);
        const originalReleaseYear = Number(row.original_release_year);
        const revivalSpotifyPopularity = Number(row.revival_spotify_popularity);
        const revivalWeeksOnChart = Number(row.revival_weeks_on_chart);
        const originalWeeksOnChart = Number(row.original_weeks_on_chart);
        const everCharted = Number(row.ever_charted) === 1;
        const relationshipType = row.relationship_type;

        if (
          !Number.isFinite(revivalPeak) ||
          !Number.isFinite(revivalChartYear) ||
          !Number.isFinite(yearsBetween) ||
          !Number.isFinite(originalReleaseYear) ||
          !RELATIONSHIP_COLOR[relationshipType]
        ) {
          return null;
        }

        return {
          id: `link-${index}`,
          revivalSong: row.revival_song,
          revivalArtist: row.revival_artist,
          revivalPeak,
          revivalChartYear,
          revivalSpotifyPopularity: Number.isFinite(revivalSpotifyPopularity) ? revivalSpotifyPopularity : 0,
          revivalWeeksOnChart: Number.isFinite(revivalWeeksOnChart) ? revivalWeeksOnChart : 1,
          originalSong: row.original_song,
          originalArtist: row.original_artist,
          originalPeak: Number.isFinite(originalPeak) ? originalPeak : null,
          originalPeakDisplay: Number.isFinite(originalPeak) ? originalPeak : null,
          originalWeeksOnChart: Number.isFinite(originalWeeksOnChart) ? originalWeeksOnChart : 1,
          originalReleaseYear,
          everCharted,
          yearsBetween: clamp(yearsBetween, 0, 90),
          relationshipType
        };
      })
        .then((rows) => {
          allRows = rows.filter(Boolean);
          buildButtons();
          render(false);

          document.addEventListener("click", () => {
            if (!lockedId) {
              return;
            }

            lockedId = null;
            resetFocus();
          });

          window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = window.setTimeout(() => render(false), 100);
          });
        })
        .catch((error) => {
          chartNode.innerHTML = `<div class="empty-state">Failed to load data: ${error.message}</div>`;
        });
    </script>
  </body>
</html>
